- evidence_id: EV-0011
  case_id: c5490
  evidence_type: document
  title: Witness follow-up interview - Maria Ortiz, 2025-05-19
  file_path: /evidence/c5490/ortiz_followup.txt
  content: 'DET. PARK: Thanks for coming back in, Ms. Ortiz. Just a few follow-ups.

    ORTIZ: Sure.

    DET. PARK: The scar you mentioned - which side?

    ORTIZ: Left eyebrow. I''m sure of that.

    DET. PARK: How was the lighting at the counter?

    ORTIZ: Bright. The overheads were all on.

    ORTIZ: And honestly, my cousin told me he''d been arrested before for stealing
    from a store, so it didn''t surprise me.

    DET. PARK: Let''s stick to what you saw that night.

    ORTIZ: Okay. He looked right at me for a few seconds.

    [end of transcript]'
  notes: 'Marked People''s Exhibit 9. Judge Okonkwo 05/21: the witness''s hearsay
    line about a prior arrest is struck - redact before showing the jury.'
  privileged: false
  uploaded_at: '2025-05-19T15:00:00'
