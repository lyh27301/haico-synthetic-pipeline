- evidence_id: EV-0001
  case_id: c5490
  evidence_type: document
  title: Witness interview - Maria Ortiz (cashier), 2025-02-11
  file_path: /evidence/c5490/ortiz_interview.txt
  content: 'DET. PARK: Walk me through what you saw.

    ORTIZ: A man came in around 9:40, grey hoodie, asked for cigarettes, then showed
    a handgun and told me to empty the register.

    DET. PARK: Did you see his face?

    ORTIZ: Yes, for maybe ten seconds. He had a scar over his left eyebrow.

    DET. PARK: Anything else?

    ORTIZ: He left in a dark sedan, I think a Honda.

    [end of transcript]'
  notes: Admitted as People's Exhibit 4 on day 2.
  privileged: false
  uploaded_at: '2025-02-12T10:00:00'
